name: Deploy to DigitalOcean

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up SSH key for DigitalOcean
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add DigitalOcean SSH host to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DO_SSH_HOST }} >> ~/.ssh/known_hostsq

      - name: SSH into DigitalOcean and deploy the app
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_SSH_HOST }} << 'EOF'
            # directory where your app should be cloned
            cd projects/

            # Clone the repository (if it’s already cloned, you can pull the latest changes)
            git clone https://github.com/Ramadhan0/url-shortener-api.git || (cd url-shortener-api/ && git pull)

            # Navigate to the application folder
            cd url-shortener-api/

            # Run Docker Compose to bring up the app
            docker stop url_shortener_api
            docker-compose up -d url_shortener_api
          EOF
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
